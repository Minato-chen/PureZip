name: PureZip
options:
  bundleIdPrefix: com.minato
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    SDKROOT: "macosx"
    SUPPORTED_PLATFORMS: "macosx"
    ENABLE_HARDENED_RUNTIME: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: "255"
    MARKETING_VERSION: "1.0.0"

targets:
  ArchiveCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ArchiveCore
    settings:
      base:
        PRODUCT_NAME: ArchiveCore
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.ArchiveCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
    dependencies:
      - sdk: libsqlite3.tbd

  ArchiveEngines:
    type: framework
    platform: macOS
    sources:
      - path: Sources/ArchiveEngines
    dependencies:
      - target: ArchiveCore
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: ArchiveEngines
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.ArchiveEngines
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  PureZipFinderSupport:
    type: framework
    platform: macOS
    sources:
      - path: Sources/PureZipFinderSupport
    dependencies:
      - target: ArchiveCore
    settings:
      base:
        PRODUCT_NAME: PureZipFinderSupport
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.FinderSupport
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        DYLIB_INSTALL_NAME_BASE: "@rpath"

  PureZipArchiveService:
    type: xpc-service
    platform: macOS
    sources:
      - path: Sources/PureZipArchiveService
    dependencies:
      - target: ArchiveCore
      - target: ArchiveEngines
    info:
      path: Support/PureZipArchiveService-Info.plist
    settings:
      base:
        PRODUCT_NAME: PureZipArchiveService
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.ArchiveService
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../Frameworks"
          - "@loader_path/../Frameworks"

  PureZipFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PureZipFinderSync
    dependencies:
      - target: ArchiveCore
      - target: PureZipFinderSupport
      - framework: FinderSync.framework
      - framework: AppKit.framework
    info:
      path: Support/PureZipFinderSync-Info.plist
    settings:
      base:
        PRODUCT_NAME: PureZipFinderSync
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.FinderSync
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../Frameworks"
          - "@loader_path/../Frameworks"

  PureZipQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/PureZipQuickLook
    dependencies:
      - target: ArchiveCore
      - target: ArchiveEngines
      - framework: Quartz.framework
      - framework: QuickLookUI.framework
      - framework: AppKit.framework
    info:
      path: Support/PureZipQuickLook-Info.plist
    settings:
      base:
        PRODUCT_NAME: PureZipQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip.QuickLook
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../../Frameworks"
          - "@loader_path/../Frameworks"

  purezip-cli:
    type: tool
    platform: macOS
    sources:
      - path: Sources/PureZipCLI
    dependencies:
      - target: ArchiveCore
      - target: ArchiveEngines
      - target: PureZipFinderSupport
    settings:
      base:
        PRODUCT_NAME: purezip-cli
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@loader_path/../Frameworks"

  PureZip:
    type: application
    platform: macOS
    sources:
      - path: Sources/PureZipApp
      - path: Resources
    dependencies:
      - target: ArchiveCore
        embed: true
      - target: ArchiveEngines
        embed: true
      - target: PureZipFinderSupport
        embed: true
      - target: PureZipArchiveService
        embed: true
      - target: PureZipFinderSync
        embed: true
      - target: PureZipQuickLook
        embed: true
      - target: purezip-cli
        embed: true
    info:
      path: Support/PureZip-Info.plist
    settings:
      base:
        PRODUCT_NAME: PureZip
        PRODUCT_BUNDLE_IDENTIFIER: com.minato.purezip
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/PureZip-Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"

schemes:
  PureZip:
    build:
      targets:
        PureZip: all
    run:
      config: Debug
